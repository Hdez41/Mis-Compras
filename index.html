<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Mi Lista de Compras</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Mis Compras</h1>
            <div class="image-container">
                <img src="image/Carrito-transformed.png" alt="Mi Foto">
            </div>
        </header>

        <button id="chrome-install-btn" style="display: none; width: 100%; margin-bottom: 20px; background-color: #198754; color: white; padding: 12px; border: none; border-radius: 14px; cursor: pointer; font-weight: bold;">
            📥 Instalar Aplicación
        </button>

        <div class="input-container">
            <input type="text" id="item-input" placeholder="Ej. Leche, Huevos, Frutas...">
            <button id="add-btn"><span class="material-icons">add</span></button>
        </div>

        <ul id="shopping-list"></ul>
    </div>

    <!-- Volvemos al script clásico sin módulos complejos -->
    <script src="app.js"></script>
</body>
</html>
